name: Validate dotfiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq \
            shellcheck \
            shfmt \
            stow \
            zsh

      - name: Run repository validation
        run: scripts/validate.sh

      - name: Test Stow installation behavior
        run: scripts/test-stow.sh

      - name: Test Pi installer behavior
        run: scripts/test-pi-installer.sh

      - name: Check managed Pi package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix configs/pi/.pi/agent
          npm ci --ignore-scripts --no-audit --no-fund \
            --prefix configs/pi/.pi/agent/extensions/subagents
          npm run check --prefix configs/pi/.pi/agent
          npm run format:check --prefix configs/pi/.pi/agent

      - name: Parse managed JSON and TOML
        run: |
          json_status=0
          while IFS= read -r -d '' path; do
            case "$path" in
              *.json|*.jsonc) jq empty "$path" || json_status=1 ;;
            esac
          done < <(git ls-files -z -- configs)
          [ "$json_status" -eq 0 ]

          python3 - <<'PY'
          import pathlib
          import tomllib

          for path in pathlib.Path("configs").rglob("*.toml"):
              with path.open("rb") as handle:
                  tomllib.load(handle)
          PY
